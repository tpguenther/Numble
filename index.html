ered=final.slice().sort((a,b)=>(last.get(a.id)??0)-(last.get(b.id)??0));\n const steps=[[]];for(const p of ordered)steps.push([...steps[steps.length-1],p]);\n return steps;\n}\nfunction completeGame(){if(completed)return;completed=true;reviewSteps=makeCuratedReview();reviewPosition=reviewSteps.length-1;resultText='Tessera \u00b7 '+formatTime(Date.now()-started)+' \u00b7 10 dominoes';$('finish-time').textContent=formatTime(Date.now()-started);if(window.parent!==window){window.parent.postMessage({type:'tessera-studio-completed',time:formatTime(Date.now()-started)},'*');return;}showScreen('finish');}\n$('play').onclick=startGame;\n\n$('how-home').onclick=()=>showScreen('rules');\n$('rules-back').onclick=()=>showScreen('home');\n\nfunction showReview(){\n reviewMode=true;reviewQueue=0;reviewBusy=false;reviewPosition=reviewSteps.length-1;\n placed=reviewSteps[reviewPosition].map(p=>({...p,values:[...p.values]}));\n for(const p of placed)orientations[p.id]=p.rot;\n $('review-controls').classList.add('active');$('board').classList.add('review-mode');\n showScreen('game');render();updateReviewControls();\n}\nfunction updateReviewControls(){\n $('review-prev').disabled=reviewPosition+Math.min(reviewQueue,0)<=0;\n $('review-next').disabled=reviewPosition+Math.max(reviewQueue,0)>=reviewSteps.length-1;\n}\nfunction reviewStep(delta){\n if(!reviewMode)return;\n const destination=Math.max(0,Math.min(reviewSteps.length-1,reviewPosition+reviewQueue+delta));\n reviewQueue=destination-reviewPosition;\n if(!reviewBusy)runReviewQueue();\n}\nfunction reviewPieceElement(id){return [...$('board').querySelectorAll('.placed-domino')].find(n=>Number(n.dataset.dominoId)===id)}\nfunction reviewTrayElement(id){return $('pieces').children[id]?.querySelector('.piece')}\nfunction flyReviewPiece(id,forward,fromRect,toRect,source){\n return new Promise(resolve=>{\n  if(!fromRect||!toRect||!source){resolve();return}\n  // Clone the DESTINATION representation, not the source: its pips and dividers\n  // already have their final dimensions. Scale the entire tile as one object.\n  const flyer=source.cloneNode(true);\n  flyer.classList.remove('active','drag-source','conflicted');\n  flyer.style.cssText='position:fixed!important;left:'+toRect.left+'px!important;top:'+toRect.top+'px!important;width:'+toRect.width+'px!important;height:'+toRect.height+'px!important;z-index:10000!important;margin:0!important;pointer-events:none!important;opacity:1!important;transition:none!important;box-shadow:none!important;';\n  flyer.style.transformOrigin='top left';\n  document.body.appendChild(flyer);\n  const scaleX=fromRect.width/toRect.width,scaleY=fromRect.height/toRect.height;\n  const tx=fromRect.left-toRect.left,ty=fromRect.top-toRect.top;\n  const start=`translate(${tx}px,${ty}px) scale(${scaleX},${scaleY})`;\n  flyer.style.transform=start;\n  const anim=flyer.animate([{transform:start},{transform:'translate(0px,0px) scale(1,1)'}],{duration:330,easing:'cubic-bezier(.3,.1,.2,1)',fill:'forwards'});\n  let done=false;const finish=()=>{if(done)return;done=true;flyer.remove();resolve()};\n  anim.onfinish=finish;anim.oncancel=finish;\n });\n}\nasync function runReviewQueue(){\n if(reviewBusy)return;reviewBusy=true;\n try{\n  while(reviewQueue!==0&&reviewMode){\n   const direction=Math.sign(reviewQueue),next=reviewPosition+direction;\n   if(next<0||next>=reviewSteps.length){reviewQueue=0;break}\n   const before=reviewSteps[reviewPosition],after=reviewSteps[next];\n   const moving=direction>0?after.find(p=>!before.some(q=>q.id===p.id)):before.find(p=>!after.some(q=>q.id===p.id));\n   if(!moving){reviewPosition=next;reviewQueue-=direction;continue}\n   const source=direction>0?reviewTrayElement(moving.id):reviewPieceElement(moving.id);\n   const startRect=source?.getBoundingClientRect();\n   reviewPosition=next;reviewQueue-=direction;\n   placed=after.map(p=>({...p,values:[...p.values]}));\n   // Preserve orientation when a domino returns to the tray.\n   orientations[moving.id]=moving.rot;\n   selected=null;render();updateReviewControls();\n   const dest=direction>0?reviewPieceElement(moving.id):reviewTrayElement(moving.id);\n   const endRect=dest?.getBoundingClientRect();\n   if(dest)dest.style.visibility='hidden';\n   await flyReviewPiece(moving.id,direction>0,startRect,endRect,dest);\n   if(dest?.isConnected)dest.style.visibility='';\n  }\n }finally{reviewBusy=false;if(reviewQueue&&reviewMode)runReviewQueue()}\n}\n$('review-prev').onclick=()=>reviewStep(-1);\n$('review-next').onclick=()=>reviewStep(1);\n$('finish-home').addEventListener('click',e=>{e.preventDefault();showReview()});\n$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({text:resultText});else if(navigator.clipboard){await navigator.clipboard.writeText(resultText);$('share').textContent='Copied!';setTimeout(()=>$('share').textContent='Share Result',1300)}}catch(e){}};\n$('logo-a').innerHTML=pipHTML(3);$('logo-b').innerHTML=pipHTML(5);\n\n// Rules illustrations share the exact pip generator used by the board.\nfunction rulesDomino(a,b,vertical=false){return `<div class=\"rules-example-domino ${vertical?'vertical':'horizontal'}\"><div class=\"piece-half\">${pipHTML(a)}<\/div><div class=\"piece-half\">${pipHTML(b)}<\/div><\/div>`;}\n$('rules-row-dominoes').innerHTML=rulesDomino(1,2)+rulesDomino(3,4)+rulesDomino(5,6);\n$('rules-box-dominoes').innerHTML=rulesDomino(1,2)+rulesDomino(4,5)+rulesDomino(3,6,true);\n$('rules-turn-dominoes').innerHTML=rulesDomino(2,4)+'<span class=\"demo-turn\">\u21bb<\/span>'+rulesDomino(2,4,true);\n\nwindow.addEventListener('message',e=>{if(!e.data||e.data.type!=='tessera-studio-load')return;const p=e.data.puzzle;if(!p||!Array.isArray(p.clues)||!Array.isArray(p.dominoes))return;PUZZLES=[p];completed=false;nextPuzzle=0;showScreen('game');init(0);});init(tenPuzzleIndices[0]);showScreen('home');\n<\/script><\/body><\/html>";

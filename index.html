<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Numble — Numerum</title><style>
:root{--ink:#2f3a40;--muted:#6b777c;--cream:#fffaf0;--edge:#343735;--yellow:#f3d77a;--sage:#dce9de;--blue:#b9d4ec;--terra:#e9b3a3}
*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}main{width:min(100%,520px);padding:22px 14px 38px;margin:0 auto}.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:28px}.top h1{text-align:center;font-size:31px;letter-spacing:-1.5px;margin:0;font-weight:820}.iconbtn{border:0;background:none;font-size:24px;color:var(--ink);padding:4px;touch-action:manipulation}.board{display:flex;flex-direction:column;gap:12px;align-items:center}.equation{display:grid;grid-template-columns:90px 25px 90px 25px 90px;align-items:center;gap:8px;padding:0;border:0;background:none}.operator{text-align:center;font-size:29px;font-weight:650;color:#59666a}.tile{width:100%;aspect-ratio:1/1;height:auto;min-width:0;background:var(--cream);border:2px solid var(--edge);border-radius:7px;display:grid;place-items:center;font-size:33px;font-weight:780;color:var(--ink);box-shadow:0 3px 0 #d4cfc5;transition:background .16s;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;padding:0}.tile.dragging{opacity:.38}.equation.true.add .tile{background:var(--yellow)}.equation.true.sub .tile{background:var(--sage)}.equation.true.mul .tile{background:var(--blue)}.equation.true.div .tile{background:var(--terra)}.tile:focus-visible{outline:3px solid #557b96;outline-offset:3px}.swaps{text-align:center;margin:23px 0 0;color:var(--muted);font-size:14px;font-weight:700}.swaps strong{color:var(--ink);font-size:23px;vertical-align:-2px;margin-right:4px}.controls{display:flex;justify-content:center;margin:25px 0 12px}.pill{height:47px;min-width:145px;border-radius:999px;padding:0 20px;font-weight:750;font-size:14px;touch-action:manipulation}.pill.primary{background:#fff;border:2px solid var(--edge);color:var(--ink)}.message{min-height:25px;text-align:center;font-size:13px;line-height:1.5;color:#5e6c68;margin:12px 0}.overlay{position:fixed;inset:0;background:#ffffffed;display:none;align-items:center;justify-content:center;z-index:30;padding:24px}.overlay.show{display:flex}.dialog{text-align:center;max-width:340px}.dialog h2{font-size:35px;letter-spacing:-1.4px;margin:0 0 10px}.dialog p{line-height:1.55;color:var(--muted)}.dialog .pill{margin-top:15px}.dragcopy{position:fixed;pointer-events:none;z-index:20;box-sizing:border-box;display:grid;place-items:center;border:2px solid var(--edge);border-radius:7px;font-weight:780;color:var(--ink);box-shadow:0 3px 0 #d4cfc5;transform:translate(-50%,-50%);padding:0;line-height:1}.tile.drop-target{outline:3px solid #557b96;outline-offset:2px}@media(max-width:380px){main{padding:16px 10px 26px}.equation{gap:3px;grid-template-columns:80px 22px 80px 22px 80px}.board{gap:10px}.tile{font-size:29px}.operator{font-size:25px}}
@media(max-width:350px){.equation{grid-template-columns:70px 18px 70px 18px 70px;gap:3px}.tile{font-size:27px}.operator{font-size:23px}}
</style></head><body><main><div class="top"><button class="iconbtn" id="info" aria-label="How to play">ⓘ</button><h1>Numble</h1><div></div></div><div class="board" id="board"></div><div class="swaps">Swaps: <strong id="remaining">0</strong></div><div class="message" id="message" aria-live="polite"></div><div class="controls"><button class="pill primary" id="new">New puzzle ↗</button></div></main><div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle">Numble</h2><p id="dialogText"></p><button class="pill primary" id="dialogClose">Keep playing</button></div></div><script>
(()=>{'use strict';
const OPS=['+','−','×','÷'],CLASSES=['add','sub','mul','div'];const board=document.getElementById('board'),msg=document.getElementById('message');let values=[],initial=[],solution=[],par=0,swaps=0,finished=false,drag=null;
const rand=n=>Math.floor(Math.random()*n),shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function valid(op,a,b,c){return op===0?a+b===c:op===1?a-b===c:op===2?a*b===c:b!==0&&a/b===c}
// Pre-screened boards: all twelve values distinct, mostly single digits,
// limited complete equation groupings, and verified minimum swap distance.
// Valid partial equations may still be dead ends; no positional hints are given.
const PUZZLES=[{"start":[21,2,5,12,8,7,4,9,10,3,24,18],"minimum":9,"solutions":2,"choices":[16,16,6,7]},{"start":[12,17,16,7,5,6,3,24,2,8,22,9],"minimum":7,"solutions":4,"choices":[16,16,4,5]},{"start":[9,8,21,16,2,6,14,5,3,23,18,4],"minimum":8,"solutions":4,"choices":[16,16,5,5]},{"start":[22,16,10,3,8,15,5,6,2,4,9,19],"minimum":9,"solutions":4,"choices":[16,16,5,5]},{"start":[9,16,7,10,24,5,13,3,4,8,2,21],"minimum":8,"solutions":4,"choices":[17,17,5,5]},{"start":[2,8,21,13,11,4,3,5,9,6,18,20],"minimum":7,"solutions":4,"choices":[17,17,5,5]},{"start":[2,24,10,8,9,21,15,17,4,6,5,3],"minimum":9,"solutions":4,"choices":[16,16,6,6]},{"start":[2,24,22,6,8,9,7,3,11,18,15,5],"minimum":8,"solutions":4,"choices":[17,17,5,6]},{"start":[8,18,5,20,19,11,2,6,3,10,4,9],"minimum":8,"solutions":4,"choices":[16,16,7,7]},{"start":[11,5,6,2,21,9,14,3,20,10,8,7],"minimum":8,"solutions":4,"choices":[18,18,5,5]},{"start":[11,4,18,8,7,20,15,3,2,5,6,23],"minimum":8,"solutions":4,"choices":[18,18,5,5]},{"start":[5,4,16,24,13,15,2,8,7,20,3,9],"minimum":8,"solutions":4,"choices":[18,18,5,5]},{"start":[7,9,14,21,18,24,5,16,6,2,3,4],"minimum":6,"solutions":4,"choices":[17,17,6,6]},{"start":[21,5,6,3,15,8,10,9,4,20,7,2],"minimum":8,"solutions":4,"choices":[17,17,7,7]},{"start":[2,3,9,10,7,11,14,16,24,4,5,6],"minimum":8,"solutions":4,"choices":[20,20,4,4]},{"start":[5,2,6,17,20,10,9,7,4,12,3,21],"minimum":8,"solutions":4,"choices":[17,17,7,7]},{"start":[4,20,16,12,9,24,8,10,5,6,7,2],"minimum":8,"solutions":4,"choices":[17,17,7,8]},{"start":[4,3,13,22,11,6,2,8,18,16,5,9],"minimum":8,"solutions":4,"choices":[19,19,5,6]},{"start":[2,24,20,7,15,9,4,3,6,8,10,12],"minimum":8,"solutions":4,"choices":[17,17,7,8]},{"start":[24,11,8,20,2,5,14,4,7,3,9,6],"minimum":6,"solutions":4,"choices":[19,19,6,6]},{"start":[16,12,4,3,18,19,5,2,11,8,6,7],"minimum":8,"solutions":4,"choices":[19,19,6,6]},{"start":[22,5,3,2,8,4,18,10,14,13,6,9],"minimum":9,"solutions":4,"choices":[20,20,5,5]},{"start":[4,24,16,3,10,2,15,20,5,7,6,8],"minimum":8,"solutions":4,"choices":[16,16,9,9]},{"start":[4,7,3,5,16,8,24,18,2,12,15,6],"minimum":8,"solutions":4,"choices":[16,16,9,10]},{"start":[12,13,2,22,5,8,9,3,6,10,14,4],"minimum":6,"solutions":4,"choices":[21,21,5,5]},{"start":[6,3,10,14,2,24,16,5,4,20,9,8],"minimum":6,"solutions":4,"choices":[18,18,8,8]},{"start":[15,5,9,21,10,8,2,7,12,17,3,6],"minimum":6,"solutions":4,"choices":[21,21,5,5]},{"start":[18,12,5,9,4,20,8,24,7,3,6,2],"minimum":7,"solutions":4,"choices":[17,17,9,10]}];
let lastPuzzle=-1;
function generate(){
 let idx=rand(PUZZLES.length);
 if(PUZZLES.length>1&&idx===lastPuzzle)idx=(idx+1+rand(PUZZLES.length-1))%PUZZLES.length;
 lastPuzzle=idx;
 const p=PUZZLES[idx];
 return {target:[],start:p.start.slice(),minimum:p.minimum};
}
function render(){board.innerHTML='';let trueCount=0;for(let r=0;r<4;r++){let a=values[r*3],b=values[r*3+1],c=values[r*3+2],good=valid(r,a,b,c);if(good)trueCount++;const row=document.createElement('div');row.className='equation '+CLASSES[r]+(good?' true':'');row.dataset.row=r;for(let j=0;j<5;j++){if(j===1||j===3){let el=document.createElement('span');el.className='operator';el.textContent=j===1?OPS[r]:'=';row.appendChild(el)}else{let idx=r*3+(j===0?0:j===2?1:2),tile=document.createElement('button');tile.type='button';tile.className='tile';tile.dataset.idx=idx;tile.textContent=values[idx];tile.setAttribute('aria-label','Number '+values[idx]+', row '+(r+1));row.appendChild(tile)}}board.appendChild(row)}document.getElementById('remaining').textContent=swaps;if(trueCount===4&&!finished){finished=true;msg.textContent='All four equations are true!';show('You solved Numble!','Swaps: '+swaps+' · Par: '+par+' · Score: '+(swaps===par?'E':swaps>par?'+'+(swaps-par):'−'+(par-swaps)),'Another puzzle')}}
function swap(a,b){if(finished||a===b)return;[values[a],values[b]]=[values[b],values[a]];swaps++;msg.textContent='';render()}
function startPuzzle(){const p=generate();solution=p.target;initial=p.start;values=initial.slice();par=p.minimum+3;swaps=0;finished=false;msg.textContent='';render()}

function show(title,body,action){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogText').textContent=body;document.getElementById('dialogClose').textContent=action;document.getElementById('overlay').classList.add('show')}
function hide(){document.getElementById('overlay').classList.remove('show')}
function clearDrag(){if(!drag)return;drag.ghost?.remove();drag.source?.classList.remove('dragging');board.querySelectorAll('.drop-target').forEach(t=>t.classList.remove('drop-target'));drag=null}
board.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t||finished)return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();const rect=t.getBoundingClientRect();drag={idx:+t.dataset.idx,x:e.clientX,y:e.clientY,pointer:e.pointerId,source:t,rect,ghost:null,moved:false};try{t.setPointerCapture(e.pointerId)}catch{}});
board.addEventListener('pointermove',e=>{if(!drag||drag.pointer!==e.pointerId)return;const d=drag;if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>7){d.moved=true;d.source.classList.add('dragging');const ghost=document.createElement('div');ghost.className='dragcopy';ghost.textContent=values[d.idx];ghost.style.width=d.rect.width+'px';ghost.style.height=d.rect.height+'px';ghost.style.fontSize=getComputedStyle(d.source).fontSize;ghost.style.background=getComputedStyle(d.source).backgroundColor;document.body.appendChild(ghost);d.ghost=ghost}if(d.ghost){d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';board.querySelectorAll('.drop-target').forEach(t=>t.classList.remove('drop-target'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(target&&+target.dataset.idx!==d.idx)target.classList.add('drop-target')}});
board.addEventListener('pointerup',e=>{if(!drag||drag.pointer!==e.pointerId)return;const d=drag;const target=d.moved?document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile'):null;const targetIdx=target?+target.dataset.idx:null;clearDrag();if(targetIdx!==null&&targetIdx!==d.idx)swap(d.idx,targetIdx)});
board.addEventListener('pointercancel',clearDrag);
document.getElementById('new').addEventListener('click',startPuzzle);document.getElementById('info').addEventListener('click',()=>show('How to play','Swap numbers until all four equations are true. A valid equation changes color, but it may not be part of the final solution. Drag one number onto another to swap them.','Got it'));document.getElementById('dialogClose').addEventListener('click',()=>{const label=document.getElementById('dialogClose').textContent;hide();if(label==='Another puzzle')startPuzzle();});startPuzzle();
})();
</script></body></html>
